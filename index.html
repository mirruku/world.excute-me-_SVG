<script>
"use strict";
/* ============================================================
   world.execute(me); — 由 storyboard.json 驱动的 SVG 播放器
   时间唯一来源：audio.currentTime（暂停即静止，seek 即刻重绘）
   帧号：frame = round(t * fps)，与分镜校验器同一量化规则
   ============================================================ */
const SB = JSON.parse(document.getElementById('sb').textContent);
window.__SPR__ = JSON.parse(document.getElementById('spr').textContent);
const W = 1920, H = 1080, CX = 960, CY = 540;
const FPS = SB.meta.fps, DUR = SB.meta.duration;
const SHOTS = SB.shots, SECS = SB.sections, PALS = SB.palette;
const TAU = Math.PI * 2;
const MONO = "'Cascadia Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace";

const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp  = (a, b, t) => a + (b - a) * t;
const smooth= t => t * t * (3 - 2 * t);
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeIn  = t => Math.pow(clamp(t), 3);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pad = (n, l = 2) => String(n).padStart(l, '0');

/* 确定性伪随机：同一 t 永远同一结果（seek 后画面一致） */
function rnd(i){ const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

/* ---------- 文本 ---------- */
function T(x, y, s, o = {}){
  const a = o.anchor || 'middle';
  return `<text x="${x}" y="${y}" text-anchor="${a}" dominant-baseline="${o.bl || 'middle'}"
    font-family="${MONO}" font-size="${o.fs || 28}" font-weight="${o.w || 400}"
    letter-spacing="${o.ls || 0}" fill="${o.c || '#fff'}" opacity="${o.op ?? 1}"
    ${o.filter ? 'filter="' + o.filter + '"' : ''}
    ${o.style ? 'style="' + o.style + '"' : ''}>${esc(s)}</text>`;
}
const BIG = (x, y, word, fs, col, op = 1, ls = 0) =>
  `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle"
    font-family="${MONO}" font-size="${fs}" font-weight="700" letter-spacing="${ls}"
    fill="${col}" opacity="${op}">${esc(word)}</text>`;
const fitFs = (word, maxW = 1660, maxFs = 250) =>
  Math.min(maxFs, maxW / (word.length * 0.605));

/* ---------- 图形 ---------- */
function pgrid(t, col, op, scroll = 0.5, hy = 640, spread = 210){
  if (op <= 0.002) return '';
  let s = `<g opacity="${op}" stroke="${col}" fill="none">`;
  for (let i = -11; i <= 11; i++)
    s += `<line x1="${CX}" y1="${hy}" x2="${CX + i * spread}" y2="${H + 60}" stroke-width="1" opacity=".55"/>`;
  for (let i = 0; i < 22; i++){
    const p = ((i + (t * scroll) % 22) / 22) % 1;
    const y = hy + (H - hy + 60) * Math.pow(p, 2.3);
    s += `<line x1="-40" y1="${y.toFixed(1)}" x2="${W + 40}" y2="${y.toFixed(1)}" stroke-width="1"
           opacity="${(0.18 + 0.75 * p).toFixed(2)}"/>`;
  }
  return s + `</g>`;
}
function dotGrid(col, op, step = 48){
  let s = `<g opacity="${op}" fill="${col}">`;
  for (let y = step; y < H; y += step)
    for (let x = step; x < W; x += step)
      s += `<circle cx="${x}" cy="${y}" r="1.2"/>`;
  return s + `</g>`;
}
function hline(y, col, op = 0.3, w = 1){
  return `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${col}" stroke-width="${w}" opacity="${op}"/>`;
}
/* 沿路径绘制的进度线（pathLength=1 + dashoffset） */
function drawPath(d, prog, col, w = 3, op = 1, extra = ''){
  const p = clamp(prog);
  return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" opacity="${op}"
    pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${(1 - p).toFixed(4)}"
    stroke-linecap="round" ${extra}/>`;
}

/* ============================================================
   少女：用户提供的立绘（去底 → WebP → 双色调染色）
   sprite 高度 = 1000 单位，锚点为图片中心，y 向下为正
   ============================================================ */
const SPR = window.__SPR__ || {};
let _clipSeq = 0;
/* alpha 采样出的点云（sprite 归一化坐标，中心为原点） */
const GIRL_PTS = (window.__SPR__ && window.__SPR__.points) || [];

const hex2rgb = h => { h = h.replace('#', ''); return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255]; };
const mixc = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);

function spriteImg(sp, filt, op = 1){
  return `<image href="${sp.href}" x="${-sp.w / 2}" y="${-sp.h / 2}" width="${sp.w}" height="${sp.h}"
    preserveAspectRatio="none" filter="${filt}" opacity="${op}"/>`;
}

/* o: {x,y,s,sprite,opacity,color,flip,glow,bands,amp,t} */
function girl(o = {}){
  const key = o.sprite || 'full';
  const sp = SPR[key];
  if (!sp) return '';
  const s = o.s ?? 1, x = o.x ?? CX, y = o.y ?? 560, op = o.opacity ?? 1;
  const fl = o.flip ? -1 : 1;
  const filt = o.color ? 'none' : 'url(#duo)';
  if (o.bands){
    let g = '';
    const n = o.bands, w = sp.w * s, h = sp.h * s, top = -h / 2, t = o.t || 0;
    for (let i = 0; i < n; i++){
      const id = 'gb' + (_clipSeq++);
      const y0 = top + h * i / n, y1 = top + h * (i + 1) / n;
      const dx = (rnd(i * 7.3 + Math.floor(t * 18)) - 0.5) * w * 0.22 * (o.amp ?? 1);
      g += `<clipPath id="${id}"><rect x="${-w / 2 - 60}" y="${y0.toFixed(1)}" width="${(w + 120).toFixed(1)}" height="${(y1 - y0 + 0.6).toFixed(1)}"/></clipPath>`;
      g += `<g clip-path="url(#${id})"><g transform="translate(${dx.toFixed(1)},0)">${spriteImg(sp, filt, op)}</g></g>`;
    }
    return `<g transform="translate(${x},${y}) scale(${fl * s},${s})">${g}</g>`;
  }
  return `<g transform="translate(${x},${y}) scale(${fl * s},${s})" ${o.glow ? 'filter="url(#soft)"' : ''}>
    ${spriteImg(sp, filt, op)}</g>`;
}

/* 线稿层：只画她真实轮廓的边缘光 */
function girlEdge(o = {}){
  const sp = SPR.edge;
  if (!sp) return '';
  const s = o.s ?? 1, x = o.x ?? CX, y = o.y ?? 560, op = o.opacity ?? .5;
  return `<g transform="translate(${x},${y}) scale(${o.flip ? -1 : 1} * ${s},${s})" opacity="${op}">
    <image href="${sp.href}" x="${-sp.w / 2}" y="${-sp.h / 2}" width="${sp.w}" height="${sp.h}"
      preserveAspectRatio="none" filter="url(#duo)" opacity=".9"/></g>`;
}

/* ============================================================
   场景注册表
   ============================================================ */
const NO_SUB = new Set(['boot','title','slam','barrage','scroll','idle','swap']);
const SCENES = {};

/* ---------- S1 开机 ---------- */
SCENES.boot = function(c){
  const p = c.p, t = c.t, st = c.shot.start, lt = t - st;
  const acc = c.pal.accent, ink = c.pal.ink;
  let s = pgrid(t, acc, 0.09, 0.10, 720);
  s += `<rect x="148" y="238" width="1624" height="640" fill="none" stroke="${acc}" stroke-opacity=".18"/>`;
  s += T(176, 214, 'MILI RUNTIME // v3.1.0 // D-MINOR', { fs: 17, c: acc, anchor: 'start', op: .55, ls: 2 });
  s += T(1744, 214, 'PID 0x3E7', { fs: 17, c: acc, anchor: 'end', op: .45, ls: 2 });

  if (p.mode === 'power'){
    const L = p.lines; let y = 330;
    L.forEach((ln, i) => {
      const k = clamp((t - (st + 0.15 + i * 0.95)) / 0.5);
      if (k <= 0) return;
      const str = ln[0].slice(0, Math.max(1, Math.ceil(ln[0].length * k)));
      if (ln[1] === 'big'){
        s += `<g opacity="${k}">` + BIG(CX, 690, '[ PROTECTION ]', 132, ink, 1, 10) + `</g>`;
        s += hline(760, acc, .3 * k);
      } else {
        s += T(200, y, (ln[1] === 'cmd' ? '› ' : '  ') + str, { fs: 30, c: ln[1] === 'cmd' ? acc : ink, anchor: 'start', op: .92 });
      }
      y += 66;
    });
    if (Math.floor(t * 4) % 2 === 0)
      s += `<rect x="200" y="${y - 24}" width="15" height="32" fill="${acc}" opacity=".9"/>`;
    const pr = clamp((t - st) / 3.4);
    s += `<rect x="200" y="810" width="500" height="2" fill="${acc}" opacity=".18"/>`;
    s += `<rect x="200" y="810" width="${500 * pr}" height="2" fill="${acc}" opacity=".8"/>`;
    s += T(720, 811, `LOADING ${Math.floor(pr * 100)}%`, { fs: 16, c: acc, anchor: 'start', op: .6 });
  }
  else if (p.mode === 'pieces'){
    for (let i = 0; i < 72; i++){
      const tx = 300 + rnd(i) * 1320, ty = 300 + rnd(i + 40) * 520;
      const delay = rnd(i + 7) * 1.9;
      const k = easeOut(clamp((t - st - delay) / 0.55));
      const yy = lerp(-160 - rnd(i + 3) * 400, ty, k);
      const w = 14 + rnd(i + 11) * 74, h = 8 + rnd(i + 19) * 46;
      s += `<rect x="${(tx - w / 2).toFixed(1)}" y="${(yy - h / 2).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}"
        fill="${acc}" fill-opacity="${(0.10 * k).toFixed(2)}" stroke="${acc}" stroke-opacity="${(0.9 * k).toFixed(2)}" stroke-width="1.4"/>`;
    }
    const k2 = clamp((t - (st + 2.75)) / 0.42);
    if (k2 > 0){
      s += `<g opacity="${k2}">` + BIG(CX, 560, 'OBJECT CREATION', 118, ink, 1, 8) + `</g>`;
      s += `<rect x="${CX - 520}" y="660" width="${1040 * k2}" height="2" fill="${acc}" opacity=".55"/>`;
    }
  }
  else if (p.mode === 'params'){
    const rows = [['name', '"me"'], ['type', 'object'], ['mass', '—'], ['memory', '—'], ['latency', '—']];
    let y = 360;
    s += T(CX, 280, 'OBJECT CREATION', { fs: 54, c: acc, ls: 12, op: .8 });
    rows.forEach((r, i) => {
      const k = clamp((t - (st + 0.2 + i * 0.62)) / 0.3);
      if (k <= 0) return;
      s += `<g opacity="${k}">`;
      s += T(660, y, r[0], { fs: 30, c: acc, anchor: 'end', op: .75 });
      s += T(700, y, ':', { fs: 30, c: ink, anchor: 'middle', op: .5 });
      const val = r[1] === '—' ? (Math.floor(t * 6) % 2 ? '· · ·' : '') : r[1];
      s += T(730, y, val, { fs: 30, c: ink, anchor: 'start', op: .95 });
      s += `<line x1="660" y1="${y + 22}" x2="1260" y2="${y + 22}" stroke="${acc}" stroke-opacity=".14"/>`;
      s += `</g>`; y += 76;
    });
    const k3 = clamp((t - (st + 2.75)) / 0.5);
    if (k3 > 0){
      s += `<g opacity="${k3}">` + BIG(CX, 760, 'INITIALIZATION', 96, ink, 1, 10) + `</g>`;
    }
  }
  else { /* sim */
    const k = easeOut(clamp(lt / 2.6));
    s = pgrid(t, acc, 0.06 + 0.30 * k, 0.3, lerp(300, 640, k));
    s += `<g opacity="${0.25 + 0.6 * k}">` + BIG(CX, 520, 'SIMULATION', fitFs('SIMULATION', 1500, 190), ink, .9, 12) + `</g>`;
    s += hline(560, acc, .25);
    const die = clamp((t - (st + 3.4)) / 0.5);
    if (die > 0) s = `<g opacity="${1 - die}">${s}</g>`;
    if (die > 0.6 && Math.floor(t * 3) % 2 === 0)
      s += `<rect x="150" y="820" width="15" height="34" fill="${acc}" opacity="${clamp((die - .6) * 2)}"/>`;
  }
  return s;
};

/* ---------- S2 标题 ---------- */
SCENES.title = function(c){
  const p = c.p, t = c.t, st = c.shot.start, lt = t - st;
  const acc = c.pal.accent, ink = c.pal.ink;
  const cmd = p.cmd || 'world.execute(me);';
  const n = Math.max(1, Math.floor(clamp(lt / 0.85) * cmd.length) + 1);
  const typed = cmd.slice(0, n);
  let s = pgrid(t, acc, 0.12, 0.22, 700);
  s += dotGrid(acc, 0.10, 60);
  /* 背后的她 */
  s += girl({ x: CX, y: 566, s: 1.02, opacity: 0.20, t });
  const gl = (Math.floor(t * 9) % 4 === 0) ? 1 : 0;
  const fs = 172;
  s += `<g font-family="${MONO}" font-size="${fs}" font-weight="700" text-anchor="middle" dominant-baseline="middle">`;
  if (gl){
    s += `<text x="${CX - 4}" y="${CY - 2}" fill="#ff2d5e" opacity=".42" style="mix-blend-mode:screen">${esc(typed)}</text>`;
    s += `<text x="${CX + 4}" y="${CY + 3}" fill="#00e0ff" opacity=".42" style="mix-blend-mode:screen">${esc(typed)}</text>`;
  }
  s += `<text x="${CX}" y="${CY}" fill="${ink}">${esc(typed)}</text></g>`;
  s += `<rect x="${CX - cmd.length * fs * 0.302}" y="${CY + 74}" width="${cmd.length * fs * 0.604}" height="2" fill="${acc}" opacity=".45"/>`;
  if (Math.floor(t * 5) % 2 === 0)
    s += `<rect x="${CX + cmd.length * fs * 0.302 - 2}" y="${CY - 62}" width="18" height="118" fill="${acc}" opacity=".85"/>`;
  s += T(CX, CY + 168, '─ RUNTIME ERROR: OBJECT "ME" HAS NO EXIT ─', { fs: 22, c: acc, op: .45, ls: 4 });
  s += T(150, 140, 'S2 / CALL', { fs: 18, c: acc, anchor: 'start', op: .5, ls: 3 });
  return s;
};

/* ---------- S2 实例化 ---------- */
SCENES.instantiate = function(c){
  const t = c.t, st = c.shot.start, lt = t - st;
  const acc = c.pal.accent, ink = c.pal.ink;
  let s = pgrid(t, acc, 0.10, 0.14, 720);
  const bx = 560, by = 190, bw = 800, bh = 700;
  const k = easeOut(clamp(lt / 0.9));
  const leg = 90 * k;
  s += `<g stroke="${acc}" stroke-width="2.4" fill="none" opacity=".85">`;
  const corners = [[bx, by, 1, 1], [bx + bw, by, -1, 1], [bx, by + bh, 1, -1], [bx + bw, by + bh, -1, -1]];
  corners.forEach(([x, y, sx, sy]) => {
    s += `<path d="M ${x} ${y + sy * leg} L ${x} ${y} L ${x + sx * leg} ${y}"/>`;
    s += `<path d="M ${x} ${y + sy * leg} L ${x} ${y} L ${x + sx * leg} ${y}" transform="translate(0,0)"/>`;
  });
  s += `</g>`;
  s += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="none" stroke="${acc}" stroke-opacity=".12"/>`;
  s += T(bx + 18, by - 20, 'object me {', { fs: 24, c: acc, anchor: 'start', op: .8 });

  if (c.p.mode === 'box'){
    const fields = ['+ id      : 0x00A1', '+ state   : IDLE', '+ origin  : UNKNOWN', '+ purpose : TO BE USED'];
    fields.forEach((f, i) => {
      const kk = clamp((t - (st + 0.7 + i * 0.55)) / 0.32);
      if (kk <= 0) return;
      s += T(1500, 300 + i * 52, f, { fs: 21, c: ink, anchor: 'start', op: .75 * kk });
    });
    s += T(bx + bw / 2, by + bh / 2 - 40, '· empty ·', { fs: 26, c: acc, op: .4 });
    s += T(bx + bw / 2, by + bh / 2 + 16, 'awaiting instantiation', { fs: 18, c: acc, op: .28, ls: 4 });
    s += `<g transform="rotate(${(t * 90) % 360} ${bx + bw / 2} ${by + bh / 2 + 90})">
      <circle cx="${bx + bw / 2}" cy="${by + bh / 2 + 90}" r="34" fill="none" stroke="${acc}" stroke-opacity=".3" stroke-dasharray="6 10"/></g>`;
    /* 十字准星 + 四角刻度 */
    s += `<g stroke="${acc}" stroke-opacity=".18"><line x1="${bx + bw / 2}" y1="${by + 60}" x2="${bx + bw / 2}" y2="${by + bh - 40}"/>
      <line x1="${bx + 60}" y1="${by + bh / 2}" x2="${bx + bw - 60}" y2="${by + bh / 2}"/></g>`;
    s += `<circle cx="${bx + bw / 2}" cy="${by + bh / 2}" r="120" fill="none" stroke="${acc}" stroke-opacity=".12" stroke-dasharray="3 9"/>
      <circle cx="${bx + bw / 2}" cy="${by + bh / 2}" r="200" fill="none" stroke="${acc}" stroke-opacity=".08" stroke-dasharray="2 14"/>`;
    for (let i = 0; i < 4; i++){
      s += T(bx + 30 + i * 250, by + bh - 24, `0x${(0xa0 + i * 16).toString(16).toUpperCase()}`, { fs: 13, c: acc, anchor: 'start', op: .25, ls: 2 });
    }
  } else {
    const a = easeOut(clamp((t - (st + 0.2)) / 2.3));
    const eyeT = clamp((t - (st + 1.9)) / 0.3);
    const gs = 0.66, gy = 566;
    /* 先给一层极淡的完整轮廓，说明「它要长成什么」 */
    s += `<g opacity=".16">${girl({ x: bx + bw / 2, y: gy, s: gs, t })}</g>`;
    /* 由上而下逐行点亮 */
    const clipY = lerp(by, by + bh, a);
    s += `<clipPath id="asm"><rect x="${bx}" y="${by}" width="${bw}" height="${Math.max(0, clipY - by).toFixed(1)}"/></clipPath>`;
    s += `<g clip-path="url(#asm)">${girl({ x: bx + bw / 2, y: gy, s: gs, t })}</g>`;
    s += `<line x1="${bx + 20}" y1="${clipY.toFixed(1)}" x2="${bx + bw - 20}" y2="${clipY.toFixed(1)}"
      stroke="${acc}" stroke-width="2" opacity="${(0.85 * (1 - a * 0.35)).toFixed(2)}"/>`;
    s += `<rect x="${bx + 20}" y="${(clipY - 26).toFixed(1)}" width="${bw - 40}" height="26" fill="${acc}" opacity=".10"/>`;
    if (eyeT > 0.5){
      s += `<circle cx="${bx + bw / 2 - 50 * gs}" cy="${gy + 14 * gs}" r="24" fill="${acc}" opacity="${0.12 * eyeT}" filter="url(#soft)"/>`;
      s += `<circle cx="${bx + bw / 2 + 50 * gs}" cy="${gy + 14 * gs}" r="24" fill="${acc}" opacity="${0.12 * eyeT}" filter="url(#soft)"/>`;
    }
    const kk = clamp((t - (st + 1.6)) / 0.5);
    if (kk > 0) s += T(bx + bw / 2, by + bh + 46, 'INSTANTIATED  ▸  object "me" has a face', { fs: 20, c: acc, op: .65 * kk, ls: 2 });
  }
  return s;
};

/* ---------- S3 几何 ---------- */
SCENES.geom = function(c){
  const t = c.t, st = c.shot.start, lt = t - st, u = c.u;
  const acc = c.pal.accent, ink = c.pal.ink;
  const gx = CX, gy = 560, gs = 0.86;
  const faceY = gy - 458 * gs;
  let s = dotGrid(acc, 0.055, 54);
  const mode = c.p.mode;

  if (mode === 'points'){
    const k = easeOut(clamp(lt / 1.6));
    const spread = lerp(520, 0, k) + 26;
    for (let i = 0; i < GIRL_PTS.length; i++){
      const [px, py] = GIRL_PTS[i];
      const jx = (rnd(i) - .5) * spread, jy = (rnd(i + 99) - .5) * spread;
      const x = gx + (px + jx) * gs, y = gy + (py + jy) * gs;
      const r = 1.1 + rnd(i + 5) * 1.5;
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${acc}" opacity="${(0.25 + 0.6 * k).toFixed(2)}"/>`;
    }
    /* 尺寸标注 */
    const kk = clamp((t - (st + 1.5)) / 0.6);
    if (kk > 0){
      const x0 = gx - 150 * gs, x1 = gx + 150 * gs, y0 = gy - 470 * gs, y1 = gy + 500 * gs;
      s += `<g opacity="${kk}" stroke="${ink}" stroke-width="1.4" fill="none">`;
      s += `<line x1="${x0}" y1="${y1 + 30}" x2="${x1}" y2="${y1 + 30}"/>`;
      s += `<line x1="${x0}" y1="${y1 + 22}" x2="${x0}" y2="${y1 + 38}"/><line x1="${x1}" y1="${y1 + 22}" x2="${x1}" y2="${y1 + 38}"/>`;
      s += `<line x1="${x0 - 34}" y1="${y0}" x2="${x0 - 34}" y2="${y1}"/>`;
      s += `<line x1="${x0 - 42}" y1="${y0}" x2="${x0 - 26}" y2="${y0}"/><line x1="${x0 - 42}" y1="${y1}" x2="${x0 - 26}" y2="${y1}"/>`;
      s += `</g>`;
      s += T(CX, y1 + 58, 'W = 300', { fs: 20, c: ink, op: .8 * kk, ls: 3 });
      s += T(x0 - 58, (y0 + y1) / 2, 'H = 970', { fs: 20, c: ink, anchor: 'end', op: .8 * kk, ls: 2 });
      s += T(gx, y0 - 46, `n = ${GIRL_PTS.length}`, { fs: 22, c: acc, op: .7 * kk, ls: 4 });
    }
    s += BIG(CX, 170, 'SET OF POINTS', 54, acc, .38, 10);
    s += BIG(CX, 856, 'DIMENSION', clamp(fitFs('DIMENSION', 1200, 118) * clamp((t - (st + 2.7)) / 0.3), 0, 118), ink, .9, 8);
  }
  else if (mode === 'circle'){
    const R = 132 * gs, cxx = gx, cyy = faceY;
    s += girl({ x: gx, y: gy, s: gs, opacity: .30, t });
    s += `<circle cx="${cxx}" cy="${cyy}" r="${R}" fill="none" stroke="${ink}" stroke-opacity=".18" stroke-width="1.5"/>`;
    s += `<circle cx="${cxx}" cy="${cyy}" r="${R * 0.62}" fill="none" stroke="${ink}" stroke-opacity=".10" stroke-width="1.2"/>`;
    const prog = clamp((t - st) / 2.2);
    s += drawPath(`M ${cxx - R} ${cyy} A ${R} ${R} 0 1 1 ${cxx - R + 0.01} ${cyy}`, prog, acc, 3.4);
    for (let i = 0; i < 36; i++){
      const a = i / 36 * TAU;
      const r1 = R - 10, r2 = R + (i % 9 === 0 ? 18 : 8);
      s += `<line x1="${cxx + Math.cos(a) * r1}" y1="${cyy + Math.sin(a) * r1}" x2="${cxx + Math.cos(a) * r2}" y2="${cyy + Math.sin(a) * r2}" stroke="${acc}" stroke-width="1" opacity=".45"/>`;
    }
    const dir = u * TAU * 1.2 - Math.PI / 2;
    s += `<line x1="${cxx}" y1="${cyy}" x2="${cxx + Math.cos(dir) * R}" y2="${cyy + Math.sin(dir) * R}" stroke="${ink}" stroke-width="1.4" opacity=".5"/>`;
    s += `<circle cx="${cxx}" cy="${cyy}" r="4" fill="${acc}"/>`;
    s += T(cxx + R * 0.42, cyy - 16, 'r', { fs: 26, c: ink, op: .8 });
    s += T(CX, 802, 'CIRCUMFERENCE = 2πr', { fs: 40, c: ink, op: .8, ls: 4 });
    s += T(CX, 846, `= ${(2 * Math.PI * 132).toFixed(1)} px`, { fs: 19, c: acc, op: .55, ls: 3 });
    s += BIG(CX, 150, 'CIRCLE', 56, acc, .4, 16);
  }
  else if (mode === 'sine'){
    const amp = 116, per = 420, ph = -u * TAU * 1.1;
    const yd = 640;
    let d = '';
    for (let x = -20; x <= W + 20; x += 8){
      const y = yd + Math.sin((x / per) * TAU + ph) * amp;
      d += (x === -20 ? 'M ' : 'L ') + x + ' ' + y.toFixed(1) + ' ';
    }
    s += `<line x1="0" y1="${yd}" x2="${W}" y2="${yd}" stroke="${acc}" stroke-opacity=".16"/>`;
    s += girl({ x: CX, y: 560, s: 0.78, opacity: .16, t });
    s += `<path d="${d}" fill="none" stroke="${acc}" stroke-width="3" opacity=".9"/>`;
    /* 切线 */
    const tx = CX + 300;
    const y0 = yd + Math.sin((tx / per) * TAU + ph) * amp;
    const slope = Math.cos((tx / per) * TAU + ph) * amp * (TAU / per);
    const dx = 260, dy = slope * dx;
    s += `<line x1="${tx - dx}" y1="${y0 - dy}" x2="${tx + dx}" y2="${y0 + dy}" stroke="${ink}" stroke-width="2.2" opacity=".85"/>`;
    s += `<circle cx="${tx}" cy="${y0}" r="7" fill="${acc}"/><circle cx="${tx}" cy="${y0}" r="18" fill="none" stroke="${acc}" stroke-opacity=".35"/>`;
    s += T(tx + 26, y0 - 44, 'TANGENT', { fs: 22, c: ink, anchor: 'start', op: .85, ls: 4 });
    s += T(tx + 26, y0 - 16, `dy/dx = ${slope.toFixed(2)}`, { fs: 18, c: acc, anchor: 'start', op: .6 });
    s += T(120, 300, 'sin(θ)', { fs: 20, c: acc, anchor: 'start', op: .5, ls: 3 });
    s += BIG(CX, 160, 'SINE WAVE', 52, acc, .35, 12);
    const k2 = clamp((t - (st + 2.7)) / 0.3);
    if (k2 > 0) s += `<g opacity="${k2}">` + BIG(CX, 872, 'TANGENTS', 92, ink, .9, 10) + `</g>`;
  }
  else { /* limit */
    const k = clamp(lt / 2.2);
    const yA = 380;
    s += girl({ x: CX, y: 560, s: 0.9, opacity: .20, t });
    s += `<line x1="0" y1="${yA}" x2="${W}" y2="${yA}" stroke="${ink}" stroke-dasharray="10 10" stroke-opacity=".35"/>`;
    let d = '';
    for (let i = 0; i <= 120; i++){
      const x = 60 + i * 15;
      const y = yA + 640 * Math.exp(-(i / 26));
      d += (i === 0 ? 'M ' : 'L ') + x + ' ' + y.toFixed(1) + ' ';
    }
    s += `<path d="${d}" fill="none" stroke="${acc}" stroke-width="3" opacity="${0.35 + 0.6 * k}"/>`;
    for (let i = 0; i < 9; i++){
      const x = 60 + i * 200 + (t * 30) % 200;
      const y = yA + 640 * Math.exp(-((x - 60) / 15 / 26));
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${acc}" opacity=".5"/>`;
    }
    const close = easeOut(clamp((t - (st + 1.5)) / 1.6));
    const off = lerp(560, 190, close);
    s += `<path d="M ${CX - off} 220 L ${CX - off} 860" stroke="${ink}" stroke-width="2" opacity=".6"/>`;
    s += `<path d="M ${CX + off} 220 L ${CX + off} 860" stroke="${ink}" stroke-width="2" opacity=".6"/>`;
    s += `<path d="M ${CX - off} 220 L ${CX - off + 34} 220 M ${CX + off} 220 L ${CX + off - 34} 220"
      stroke="${ink}" stroke-width="2" opacity=".6"/>`;
    s += T(CX, 190, 'lim   x → ∞', { fs: 46, c: ink, op: .8, ls: 4 });
    if (t > st + 2.4) s += BIG(CX, 846, 'LIMITATIONS', 88, ink, clamp((t - st - 2.4) / 0.25), 8);
  }
  return s;
};

/* ---------- S4 声波 / 电流 ---------- */
SCENES.wave = function(c){
  const t = c.t, st = c.shot.start, lt = t - st, u = c.u;
  const acc = c.pal.accent, ink = c.pal.ink;
  let s = dotGrid(acc, 0.05, 56);
  const mode = c.p.mode;

  if (mode === 'current'){
    s += `<rect x="230" y="270" width="1460" height="480" fill="none" stroke="${acc}" stroke-opacity=".22"/>`;
    for (let i = 0; i <= 12; i++){
      s += `<line x1="${230 + i * 121.6}" y1="270" x2="${230 + i * 121.6}" y2="750" stroke="${acc}" stroke-opacity=".08"/>`;
    }
    s += hline(510, acc, .18);
    const sw = t > st + 1.55;
    let d = '';
    for (let x = 240; x <= 1680; x += 6){
      const local = x - 240;
      let y;
      if (!sw) y = 510 + Math.sin(local / 90 + t * 6) * 120;
      else y = 510 + Math.sin(local / 90) * 120 * Math.max(0, 1 - (t - st - 1.55) * 1.4);
      d += (x === 240 ? 'M ' : 'L ') + x + ' ' + y.toFixed(1) + ' ';
    }
    s += `<path d="${d}" fill="none" stroke="${acc}" stroke-width="3.2" filter="url(#soft)" opacity=".95"/>`;
    s += `<path d="${d}" fill="none" stroke="${ink}" stroke-width="1.4" opacity=".8"/>`;
    s += BIG(CX, 200, sw ? 'DC' : 'AC', 130, ink, .9, 6);
    s += T(CX, 820, sw ? 'direct current — 不再摆动' : 'alternating current — 摆动的电流', { fs: 22, c: acc, op: .55, ls: 3 });
    /* 开关 */
    const kb = 1200, ky = 880;
    s += `<g transform="translate(${kb},${ky})">`;
    s += `<rect x="-90" y="-34" width="180" height="68" rx="34" fill="none" stroke="${acc}" stroke-opacity=".5"/>`;
    s += `<circle cx="${sw ? 44 : -44}" cy="0" r="26" fill="${acc}" opacity=".85"/>`;
    s += `<circle cx="${sw ? 44 : -44}" cy="0" r="26" fill="#000" opacity=".35"/>`;
    s += `</g>`;
    s += T(kb - 130, ky, 'AC', { fs: 22, c: sw ? acc : ink, anchor: 'end', op: sw ? .5 : .95 });
    s += T(kb + 130, ky, 'DC', { fs: 22, c: sw ? ink : acc, anchor: 'start', op: sw ? .95 : .5 });
  }
  else if (mode === 'vision'){
    /* 眼部特写：直接用立绘近景，切片错位 + 眩晕环 */
    const wob = Math.sin(t * 9) * 7 * clamp(lt / 1.2);
    const shake = (rnd(Math.floor(t * 20)) - .5) * 10 * clamp((lt - 1.2) / 1);
    s += `<g transform="translate(${(wob + shake).toFixed(1)},${(Math.cos(t * 7) * 5).toFixed(1)})">`;
    s += girl({ x: CX + 96, y: 760, s: 2.35, sprite: 'bust', bands: 6, amp: .55, t, opacity: .95 });
    s += `</g>`;
    /* 打码式的水平扫描条 */
    for (let i = 0; i < 5; i++){
      const y = 180 + ((t * 220 + i * 150) % 640);
      s += `<rect x="0" y="${y.toFixed(0)}" width="${W}" height="${(2 + (i % 3) * 3)}" fill="${acc}" opacity=".07"/>`;
    }
    /* 眩晕环 */
    for (let i = 0; i < 7; i++){
      const r = 160 + i * 96 + Math.sin(t * 2 + i) * 16;
      s += `<ellipse cx="${CX}" cy="470" rx="${r}" ry="${(r * 0.34).toFixed(0)}" fill="none"
        stroke="${acc}" stroke-opacity="${(0.16 - i * 0.018).toFixed(3)}" stroke-width="2"
        transform="rotate(${(t * 24 * (i % 2 ? 1 : -1)).toFixed(1)} ${CX} 470)"/>`;
    }
    s += `<rect x="0" y="716" width="${W}" height="364" fill="${c.pal.base[0]}" opacity=".76"/>`;
    s += T(CX, 776, 'vision : null', { fs: 52, c: ink, op: .9, ls: 8 });
    const k = clamp((t - st - 1.4) / .5);
    if (k > 0) s += `<g opacity="${k}">` + BIG(CX, 862, 'SO DIZZY', 74, acc, .85, 16) + `</g>`;
  }
  else if (mode === 'travel'){
    const p = clamp(lt / 3.3);
    const year = Math.round(lerp(2026, -300, p));
    s += `<line x1="0" y1="600" x2="${W}" y2="600" stroke="${acc}" stroke-opacity=".35" stroke-width="2"/>`;
    for (let i = 0; i < 60; i++){
      const x = ((i * 160 - t * 900) % (W + 320) + W + 320) % (W + 320) - 160;
      const big = i % 5 === 0;
      s += `<line x1="${x}" y1="600" x2="${x}" y2="${600 + (big ? 44 : 20)}" stroke="${acc}" stroke-width="${big ? 2 : 1}" opacity="${big ? .7 : .3}"/>`;
      if (big) s += T(x, 676, String(2000 - i * 40), { fs: 17, c: acc, op: .4 });
    }
    s += BIG(CX, 420, String(year), 190, ink, .95, 2);
    s += T(CX, 520, year > 0 ? 'A.D.' : 'B.C.', { fs: 40, c: acc, op: .8, ls: 10 });
    for (let i = 0; i < 8; i++){
      s += `<rect x="${CX - 380 + i * 96}" y="740" width="60" height="4" fill="${acc}" opacity="${(0.5 - i * 0.05).toFixed(2)}"/>`;
    }
    s += T(CX, 820, '− travelling backward −', { fs: 22, c: acc, op: .5, ls: 5 });
    s += girl({ x: CX, y: 620, s: 0.5, opacity: .30, t });
  }
  else { /* unite */
    const k = easeOut(clamp(lt / 2.6));
    const gap = lerp(150, 6, k);
    let d1 = '', d2 = '';
    for (let x = 0; x <= W; x += 8){
      const base = 560;
      const y1 = base - gap + Math.sin(x / 130 + t * 3) * 90;
      const y2 = base + gap + Math.sin(x / 130 + t * 3) * 90 * (1 - k * 0.55);
      d1 += (x === 0 ? 'M ' : 'L ') + x + ' ' + y1.toFixed(1) + ' ';
      d2 += (x === 0 ? 'M ' : 'L ') + x + ' ' + y2.toFixed(1) + ' ';
    }
    s += `<path d="${d1}" fill="none" stroke="${acc}" stroke-width="3" opacity=".85"/>`;
    s += `<path d="${d2}" fill="none" stroke="${ink}" stroke-width="3" opacity=".6"/>`;
    if (k > .75){
      s += `<rect x="0" y="${560 - gap - 8}" width="${W}" height="${gap * 2 + 16}" fill="${acc}" opacity="${((k - .75) * 1.6).toFixed(2)}" filter="url(#soft)"/>`;
      for (let i = 1; i <= 5; i++){
        s += `<circle cx="${CX}" cy="560" r="${i * 90 * (k - .75) * 4}" fill="none" stroke="${acc}" stroke-opacity="${(0.5 - i * 0.09).toFixed(2)}" stroke-width="2"/>`;
      }
    }
    s += T(CX, 300, `phase_diff = ${(90 * (1 - k)).toFixed(1)}°`, { fs: 24, c: acc, op: .6, ls: 3 });
    s += BIG(CX, 830, 'UNITE', 96, ink, .5 + k * .4, 20);
    s += T(CX, 910, 'so deeply  ·  so deeply', { fs: 22, c: acc, op: .5, ls: 4 });
  }
  return s;
};

/* ---------- S5/S12 大字砸下 ---------- */
SCENES.slam = function(c){
  const t = c.t, st = c.shot.start, lt = t - st, u = c.u;
  const acc = c.pal.accent, ink = c.pal.ink;
  const word = c.p.word, sub = c.p.sub || '';
  let s = pgrid(t, acc, 0.16, 0.55, 660);
  s += `<g>${girl({ x: CX, y: 556, s: 1.02, opacity: .20, t })}</g>`;
  /* 挤压线 */
  for (let i = 0; i < 26; i++){
    const a = i / 26 * TAU + u * 0.6;
    const x1 = CX + Math.cos(a) * 1000, y1 = 540 + Math.sin(a) * 620;
    const x2 = CX + Math.cos(a) * 620, y2 = 540 + Math.sin(a) * 340;
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${acc}" stroke-width="1.4" opacity="${0.10 + 0.18 * (1 - u)}"/>`;
  }
  const fs = fitFs(word, 1620, 236);
  const pop = 1 + 0.22 * (1 - easeOut(clamp(lt / 0.22)));
  const shear = Math.sin(lt * 22) * 2.5 * Math.max(0, 1 - lt / 1.2);
  s += `<g transform="translate(${CX},${CY - 40}) scale(${pop.toFixed(3)}) skewX(${shear.toFixed(2)})">`;
  s += `<text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="${MONO}"
    font-size="${fs}" font-weight="700" letter-spacing="-2" fill="none"
    stroke="${acc}" stroke-width="1.2" stroke-opacity=".55">${esc(word)}</text>`;
  s += BIG(0, 0, word, fs, ink, .96, -2);
  s += `</g>`;
  s += T(CX, CY - 40 + fs * 0.52 + 52, sub, { fs: 28, c: acc, op: .7, ls: 5 });
  /* 上下边框 */
  s += hline(150, acc, .28);
  s += hline(930, acc, .28);
  s += T(160, 120, `PARAM_${pad(c.p.idx + 1)}`, { fs: 18, c: acc, anchor: 'start', op: .5, ls: 3 });
  s += T(1760, 120, 'EXECUTE_OK', { fs: 18, c: acc, anchor: 'end', op: .5, ls: 3 });
  /* 粒子 */
  for (let i = 0; i < 30; i++){
    const x = rnd(i + 3) * W, y = rnd(i + 77) * H;
    const dy = (t * (20 + rnd(i) * 60)) % H;
    s += `<rect x="${x.toFixed(0)}" y="${((y + dy) % H).toFixed(0)}" width="2" height="${(8 + rnd(i) * 26).toFixed(0)}"
      fill="${acc}" opacity="${(0.10 + rnd(i + 1) * 0.18).toFixed(2)}"/>`;
  }
  return s;
};

/* ---------- S6 类型替换 ---------- */

    C -74,-44 -42,-92 0,-92 Z" fill="none" stroke="${st}" stroke-width="${sw}"/>
    <path d="M 0,-92 C -6,-120 6,-134 30,-140 C 20,-118 14,-104 0,-92" fill="none" stroke="${st}" stroke-width="${sw}"/>
    <path d="M -30,-60 C -46,-24 -46,34 -30,74" fill="none" stroke="${st}" stroke-width="${sw * .6}" opacity=".55"/>
    <path d="M 22,-58 C 36,-20 36,30 20,70" fill="none" stroke="${st}" stroke-width="${sw * .6}" opacity=".55"/>`;
}
function iconTomato(st, sw){
  return `<circle cx="0" cy="18" r="88" fill="none" stroke="${st}" stroke-width="${sw}"/>
    <path d="M 0,-74 L -8,-104 M 0,-74 L 6,-106 M 0,-70 L -42,-92 M 0,-70 L 44,-94 M 0,-70 L -66,-56 M 0,-70 L 68,-58"
      fill="none" stroke="${st}" stroke-width="${sw * .9}"/>
    <path d="M -52,24 C -34,4 -12,4 0,18" fill="none" stroke="${st}" stroke-width="${sw * .6}" opacity=".5"/>
    <path d="M 8,20 C 28,2 48,6 54,26" fill="none" stroke="${st}" stroke-width="${sw * .6}" opacity=".5"/>`;

function iconCat(st, sw){

    C 104,30 76,84 0,92 C -76,84 -104,30 -96,-26 Z" fill="none" stroke="${st}" stroke-width="${sw}"/>
    <circle cx="-34" cy="-6" r="9" fill="${st}"/><circle cx="34" cy="-6" r="9" fill="${st}"/>
    <path d="M 0,16 L -7,26 L 7,26 Z" fill="${st}"/>
    <path d="M -14,34 C -6,44 6,44 14,34" fill="none" stroke="${st}" stroke-width="${sw * .8}"/>
    <path d="M -60,10 L -104,-6 M -60,22 L -104,20 M 60,10 L 104,-6 M 60,22 L 104,20"
      fill="none" stroke="${st}" stroke-width="${sw * .5}" opacity=".6"/>`;

function iconGod(st, sw){
  return `<circle cx="0" cy="-118" r="26" fill="none" stroke="${st}" stroke-width="${sw}"/>
    <circle cx="0" cy="-118" r="42" fill="none" stroke="${st}" stroke-width="${sw * .5}" stroke-dasharray="4 8" opacity=".6"/>
    <path d="M 0,-92 L 0,40 M 0,4 L -58,-32 M 0,4 L 58,-32 M 0,40 L -40,116 M 0,40 L 40,116"
      fill="none" stroke="${st}" stroke-width="${sw}" stroke-linecap="round"/>`;

SCENES.swap = function(c){
  const t = c.t, st = c.shot.start, lt = t - st, u = c.u;
  const acc = c.pal.accent, ink = c.pal.ink, item = c.p.item;
  let s = dotGrid(acc, 0.05, 58);
  s += girl({ x: CX, y: 560, s: 0.94, opacity: .10, t });
  s += `<rect x="${CX - 430}" y="180" width="860" height="600" fill="none" stroke="${acc}" stroke-opacity=".14" stroke-dasharray="6 10"/>`;
  /* 替换闪光 */
  const flash = clamp(1 - lt / 0.22);
  let icon = '';
  const IS = 2.7, sw = 2.8;
  if (item === 'eggplant') icon = iconEggplant(ink, sw);
  if (item === 'tomato')   icon = iconTomato(ink, sw);
  if (item === 'cat')      icon = iconCat(ink, sw);
  if (item === 'god')      icon = iconGod(ink, sw);
  const sc = (item === 'god' ? 1.9 : IS) * (1 + flash * 0.12);
  s += `<g transform="translate(${CX},${CY + 10}) scale(${sc})" opacity="${0.95 - flash * 0.4}">${icon}</g>`;
  if (flash > 0) s += `<rect x="0" y="0" width="${W}" height="${H}" fill="${acc}" opacity="${(flash * 0.16).toFixed(3)}"/>`;
  /* type 标签 */
  s += T(CX, 178, `type : "${item}"`, { fs: 26, c: acc, op: .8, ls: 4 });
  s += T(CX, 216, '// the outline stays. only the content changes.', { fs: 16, c: acc, op: .28, ls: 2 });
  const k = clamp((t - (st + 0.9)) / 0.35);
  if (k > 0) s += BIG(CX, 880, c.p.label, fitFs(c.p.label, 1400, 108), ink, .92 * k, 6);
  s += hline(806, acc, .20);
  s += T(160, 760, `ARGUMENT_${(c.shot.lyrics[0] ? c.shot.lyrics[0].text.length : 0)}`, { fs: 16, c: acc, anchor: 'start', op: .35, ls: 3 });
  return s;
};

/* ---------- S7 身份改写 ---------- */
SCENES.morph = function(c){
  const t = c.t, st = c.shot.start, lt = t - st, u = c.u;
  const acc = c.pal.accent, ink = c.pal.ink;
  let s = dotGrid(acc, 0.045, 60);
  const mode = c.p.mode;

  if (mode === 'gender'){
    s += `<rect x="${CX - 1}" y="60" width="2" height="960" fill="${acc}" opacity=".35"/>`;
    const flip = Math.floor(t / 1.1) % 2;
    s += girl({ x: CX - 322, y: 566, s: 0.66, opacity: flip ? .38 : .92, t });
    s += girl({ x: CX + 322, y: 566, s: 0.66, flip: true, opacity: flip ? .92 : .38, t });
    s += T(CX - 610, 250, 'F', { fs: 92, c: flip ? acc : ink, op: flip ? .35 : .95, w: 700 });
    s += T(CX + 610, 250, 'M', { fs: 92, c: flip ? ink : acc, op: flip ? .95 : .35, w: 700 });
    s += `<rect x="${CX - 653}" y="302" width="86" height="3" fill="${acc}" opacity="${flip ? .3 : .9}"/>`;
    s += `<rect x="${CX + 567}" y="302" width="86" height="3" fill="${acc}" opacity="${flip ? .9 : .3}"/>`;
    s += T(CX, 880, 'gender : ' + (flip ? '"M"' : '"F"'), { fs: 32, c: ink, op: .9, ls: 5 });
    s += T(CX, 932, '// two layers, one switch', { fs: 17, c: acc, op: .35, ls: 2 });
  }
  else if (mode === 'clock'){
    const sp = t * 6.2;
    const cx = CX, cy = 500, R = 280;
    s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${acc}" stroke-opacity=".3" stroke-width="2"/>`;
    for (let i = 0; i < 60; i++){
      const a = i / 60 * TAU - Math.PI / 2;
      const r2 = R - (i % 5 === 0 ? 28 : 12);
      s += `<line x1="${cx + Math.cos(a) * (R - 2)}" y1="${cy + Math.sin(a) * (R - 2)}"
        x2="${cx + Math.cos(a) * r2}" y2="${cy + Math.sin(a) * r2}"
        stroke="${acc}" stroke-width="${i % 5 === 0 ? 2 : 1}" opacity="${i % 5 === 0 ? .7 : .3}"/>`;
    }
    for (let i = 0; i < 12; i++){
      const a = i / 12 * TAU - Math.PI / 2;
      s += T(cx + Math.cos(a) * (R - 56), cy + Math.sin(a) * (R - 56), String(i === 0 ? 12 : i), { fs: 26, c: ink, op: .6 });
    }
    const ha = sp * 0.6 - Math.PI / 2, ma = sp * 2.4 - Math.PI / 2;
    s += `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(ha) * (R - 120)}" y2="${cy + Math.sin(ha) * (R - 120)}" stroke="${ink}" stroke-width="5" opacity=".85" stroke-linecap="round"/>`;
    s += `<line x1="${cx}" y1="${cy}" x2="${cx + Math.cos(ma) * (R - 62)}" y2="${cy + Math.sin(ma) * (R - 62)}" stroke="${acc}" stroke-width="3" opacity=".9" stroke-linecap="round"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="8" fill="${acc}"/>`;
    const isAM = (Math.floor(t / 1.6) % 2) === 0;
    s += BIG(CX, 880, isAM ? 'AM' : 'PM', 120, ink, .92, 16);
    s += T(CX, 960, 'from AM to PM — one full turn', { fs: 17, c: acc, op: .4, ls: 3 });
  }
  else if (mode === 'role'){
    const a0 = t * 1.1;
    s += girl({ x: CX, y: 556, s: 0.86, opacity: .82, t });
    for (let i = 0; i < 2; i++){
      const a = a0 + i * Math.PI;
      const x = CX + Math.cos(a) * 560, y = 500 + Math.sin(a) * 210;
      const sc = 1 + Math.sin(a) * 0.25;
      s += T(x, y, i === 0 ? 'S' : 'M', { fs: 120 * sc, c: i === 0 ? ink : acc, op: (.4 + .5 * (0.5 + 0.5 * Math.sin(a))).toFixed(2), w: 700 });
    }
    s += `<ellipse cx="${CX}" cy="500" rx="560" ry="210" fill="none" stroke="${acc}" stroke-opacity=".14" stroke-dasharray="5 12"/>`;
    s += T(CX, 880, 'role : "S" ⇄ "M"', { fs: 34, c: ink, op: .85, ls: 5 });
  }
  else { /* trance */
    const tilt = Math.sin(t * 0.9) * 5;
    s += `<g transform="rotate(${tilt.toFixed(2)} ${CX} ${CY})">`;
    for (let i = 9; i >= 1; i--){
      const r = i * 90 + (t * 40) % 90;
      s += `<circle cx="${CX}" cy="${CY}" r="${r.toFixed(1)}" fill="none" stroke="${i % 2 ? acc : ink}"
        stroke-opacity="${(0.30 - i * 0.024).toFixed(2)}" stroke-width="${i % 2 ? 2 : 1}"
        stroke-dasharray="${i % 3 === 0 ? '18 26' : 'none'}" transform="rotate(${(t * 18 * (i % 2 ? 1 : -1)).toFixed(1)} ${CX} ${CY})"/>`;
    }
    s += girl({ x: CX, y: 552, s: 0.78, opacity: .62, t });
    s += `</g>`;
    s += BIG(CX, 150, 'THE TRANCE', 62, acc, .5, 14);
    const k = clamp((t - st - 2) / 1);
    if (k > 0) s += `<rect x="0" y="0" width="${W}" height="${H}" fill="${acc}" opacity="${(k * 0.07).toFixed(3)}"/>`;
  }
  return s;
};

/* ---------- S8 振动 / 完成 / 孤立 ---------- */
SCENES.burst = function(c){
  const t = c.t, st = c.shot.start, lt = t - st, u = c.u, beat = c.beat;
  const acc = c.pal.accent, ink = c.pal.ink;
  let s = dotGrid(acc, 0.04, 60);
  const mode = c.p.mode;

  if (mode === 'vibration'){
    s += girl({ x: CX, y: 560, s: 0.92, opacity: .72, t });
    for (let i = 0; i < 7; i++){
      const p = ((t * 0.85 + i / 7) % 1);
      const r = 120 + p * 760;
      s += `<circle cx="${CX}" cy="500" r="${r.toFixed(0)}" fill="none" stroke="${acc}"
        stroke-width="${(2.6 - p * 2).toFixed(1)}" opacity="${((1 - p) * 0.55).toFixed(2)}"/>`;
    }
    for (let i = 0; i < 40; i++){
      const a = rnd(i) * TAU, r = 140 + ((t * 220 + rnd(i + 9) * 600) % 700);
      s += `<circle cx="${(CX + Math.cos(a) * r).toFixed(0)}" cy="${(500 + Math.sin(a) * r * 0.9).toFixed(0)}"
        r="${(1.5 + rnd(i + 3) * 2.5).toFixed(1)}" fill="${acc}" opacity="${(0.25 + beat * 0.5).toFixed(2)}"/>`;
    }
    s += `<circle cx="${CX}" cy="500" r="${(70 + beat * 26).toFixed(1)}" fill="${acc}" opacity="${(0.10 + beat * 0.18).toFixed(2)}" filter="url(#soft)"/>`;
    s += BIG(CX, 150, 'VIBRATIONS', 60, ink, .55, 10);
    s += T(CX, 900, `f = ${(129.2 / 60 * 2).toFixed(2)} Hz  ·  A = ${(0.6 + beat * 0.4).toFixed(2)}`, { fs: 20, c: acc, op: .5, ls: 3 });
  }
  else if (mode === 'completion'){
    const R = 250, cx = CX, cy = 490;
    const k = easeOut(clamp((t - (st + 1.4)) / 1.9));
    const gap = lerp(1.35, 0.001, k);
    const a0 = -Math.PI / 2 + gap / 2, a1 = -Math.PI / 2 + TAU - gap / 2;
    const x0 = cx + Math.cos(a0) * R, y0 = cy + Math.sin(a0) * R;
    const x1 = cx + Math.cos(a1) * R, y1 = cy + Math.sin(a1) * R;
    s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${acc}" stroke-opacity=".12" stroke-width="1.4"/>`;
    s += `<path d="M ${x0} ${y0} A ${R} ${R} 0 1 1 ${x1} ${y1}" fill="none" stroke="${acc}" stroke-width="4" stroke-linecap="round" filter="url(#soft)"/>`;
    s += `<path d="M ${x0} ${y0} A ${R} ${R} 0 1 1 ${x1} ${y1}" fill="none" stroke="${ink}" stroke-width="1.6"/>`;
    s += T(cx, cy - 10, `${(100 - gap / TAU * 100).toFixed(1)}%`, { fs: 64, c: ink, op: .9 });
    s += T(cx, cy + 54, 'COMPLETION', { fs: 24, c: acc, op: .6, ls: 6 });
    if (k > .985){
      for (let i = 0; i < 3; i++)
        s += `<circle cx="${cx}" cy="${cy}" r="${R + i * 22}" fill="none" stroke="${acc}" stroke-opacity="${(0.4 - i * 0.12).toFixed(2)}" stroke-width="2"/>`;
    }
    s += girl({ x: CX, y: 720, s: 0.36, opacity: .30, t });
    s += BIG(CX, 900, k > .985 ? 'CLOSED' : 'NOT CLOSED', 44, acc, .55, 8);
  }
  else { /* isolation */
    const k = easeOut(clamp(lt / 1.6));
    s += `<g opacity="${(0.5 * (1 - k)).toFixed(2)}">${pgrid(t, acc, 0.3, 0.1, 640)}</g>`;
    const sc = lerp(0.78, 0.30, k);
    s += girl({ x: CX, y: 640, s: sc, opacity: lerp(.9, .55, k), t });
    s += T(CX, 200, 'ISOLATION', { fs: 30, c: acc, op: .25 + .25 * k, ls: 22 });
    for (let i = 0; i < 3; i++){
      const r = 380 + i * 220;
      s += `<circle cx="${CX}" cy="620" r="${r}" fill="none" stroke="${acc}" stroke-opacity="${(0.05 - i * 0.012).toFixed(3)}"/>`;
    }
    s += T(CX, 960, 'you have left', { fs: 19, c: acc, op: .22, ls: 8 });
  }
  return s;
};

/* ---------- S8 连打 you have left ---------- */
SCENES.left = function(c){
  const t = c.t, st = c.shot.start, lt = t - st;
  const acc = c.pal.accent, ink = c.pal.ink;
  let s = dotGrid(acc, 0.04, 62);
  const lines = c.shot.lyrics.filter(l => l.t <= t);
  s += girl({ x: CX - 130, y: 600, s: 0.74, opacity: .55, t });
  lines.forEach((l, i) => {
    const age = t - l.t;
    const k = clamp(age / 0.16);
    const x = 260 + i * 60 - age * 40;
    const y = 300 + i * 96;
    const op = clamp(1 - age / 2.2) * 0.9;
    s += `<g opacity="${op.toFixed(2)}" transform="translate(${(i * 4 * k).toFixed(1)},0)">`;
    s += T(x, y, '▌ ' + l.text.toUpperCase(), { fs: 56, c: i === lines.length - 1 ? ink : acc, anchor: 'start', op: Math.min(1, k) });
    s += `</g>`;
  });
  /* 被带走的图层 */
  for (let i = 0; i < 5; i++){
    const alive = i < (5 - (lines.length % 5));
    s += `<rect x="${1500 + i * 34}" y="200" width="22" height="22" fill="none" stroke="${acc}"
      stroke-opacity="${(alive ? .45 : .08).toFixed(2)}"/>`;
  }
  s += T(1500, 176, 'layers', { fs: 15, c: acc, anchor: 'start', op: .4, ls: 4 });
  s += T(CX, 900, 'left  ·  left  ·  left', { fs: 22, c: acc, op: .3, ls: 10 });
  return s;
};

/* ---------- S9 碎片 ---------- */
SCENES.shatter = function(c){
  const t = c.t, st = c.shot.start, lt = t - st;
  const acc = c.pal.accent, ink = c.pal.ink;
  let s = pgrid(t, acc, 0.12, 0.2, 680);
  const k = clamp(lt / 1.2);
  const back = clamp((lt - 2.4) / 1.2);
  s += `<g opacity="${(1 - clamp(lt / 3.4)).toFixed(2)}">${girl({ x: CX, y: 560, s: 0.9, opacity: .45, t })}</g>`;
  const N = 190;
  for (let i = 0; i < N; i++){
    const p = GIRL_PTS[(i * 7) % GIRL_PTS.length];
    const a = Math.atan2(p[1], p[0]);
    const dist = 260 * easeOut(k) * (0.35 + rnd(i) * 1.1) * (1 - back * 0.92);
    const x = CX + p[0] * 1.15 + Math.cos(a) * dist;
    const y = 560 + p[1] * 1.15 + Math.sin(a) * dist - k * 40 * rnd(i + 5);
    const sz = 4 + rnd(i + 2) * 16;
    const rot = (k * 360 * (rnd(i + 8) - .5)).toFixed(0);
    s += `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${rot})">
      <rect x="${(-sz / 2).toFixed(1)}" y="${(-sz / 2).toFixed(1)}" width="${sz.toFixed(1)}" height="${sz.toFixed(1)}"
      fill="${i % 5 === 0 ? acc : 'none'}" fill-opacity=".35" stroke="${acc}" stroke-width="1"
      stroke-opacity="${(0.6 * (1 - back * 0.7)).toFixed(2)}"/></g>`;
  }
  if (back > 0.8) s += `<g opacity="${((back - 0.8) * 4).toFixed(2)}">${girl({ x: CX, y: 560, s: 0.9, opacity: .8, t })}</g>`;
  s += T(CX, 160, 'FRAGMENTS', { fs: 44, c: ink, op: .7, ls: 18 });
  s += T(CX, 210, `erase(pointless) → ${(N * (1 - back)).toFixed(0)} 块待清除`, { fs: 19, c: acc, op: .45, ls: 2 });
  return s;
};

/* ---------- S9 报错 ---------- */
SCENES.error = function(c){
  const t = c.t, st = c.shot.start, lt = t - st;
  const acc = c.pal.accent, ink = c.pal.ink;
  let s = '';
  if (c.p.mode === 'disheartened'){
    s += dotGrid(acc, 0.05, 60);
    s += `<defs><linearGradient id="cut" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".72" stop-color="#000" stop-opacity="0"/>
      <stop offset=".78" stop-color="#000" stop-opacity=".92"/><stop offset="1" stop-color="#000" stop-opacity=".98"/>
      </linearGradient></defs>`;
    s += `<g opacity=".85">${girl({ x: CX - 70, y: 560, s: 1.0, opacity: .7, t })}</g>`;
    s += `<rect x="0" y="0" width="${W}" height="${H}" fill="url(#cut)"/>`;
    s += `<line x1="${CX + 240}" y1="120" x2="${CX + 240}" y2="960" stroke="${acc}" stroke-width="1" opacity="${(0.3 + 0.3 * Math.sin(t * 8)).toFixed(2)}"/>`;
    s += T(200, 840, 'left_me_so_disheartened', { fs: 30, c: ink, anchor: 'start', op: .7, ls: 2 });
    s += T(200, 884, `// ${(100 - 78 * clamp(lt / 3)).toFixed(1)}% of object missing`, { fs: 18, c: acc, anchor: 'start', op: .45 });
    s += T(1720, 160, 'DISHEARTENED', { fs: 44, c: acc, anchor: 'end', op: .55, ls: 8 });
  }
  else {
    s += `<g opacity=".25">`;
    for (let i = 0; i < 26; i++){
      const y = 80 + i * 40 + ((t * 34) % 40);
      s += T(120, y, `at Object.execute (runtime.js:${120 + i * 7}:${13 + i})`, { fs: 15, c: acc, anchor: 'start', op: .35, ls: 1 });
    }
    s += `</g>`;
    const blink = Math.floor(t * 4) % 2;
    const bx = 480, by = 280, bw = 960, bh = 440;
    s += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="#0a0203" stroke="${acc}" stroke-width="2" opacity=".96"/>`;
    s += `<rect x="${bx}" y="${by}" width="${bw}" height="46" fill="${acc}" opacity="${blink ? .95 : .7}"/>`;
    s += T(bx + 18, by + 23, 'SYSTEM — ILLEGAL ARGUMENTS', { fs: 20, c: '#0a0203', anchor: 'start', op: 1, ls: 3, w: 700 });
    s += T(bx + bw - 30, by + 23, '✕', { fs: 22, c: '#0a0203', op: 1 });
    s += T(CX, by + 140, 'You have made some', { fs: 34, c: ink, op: .85, ls: 3 });
    const k = clamp((t - (st + 2.2)) / 0.4);
    if (k > 0) s += BIG(CX, by + 220, 'ILLEGAL ARGUMENTS', 74 * (0.9 + 0.1 * k), acc, k, 4);
    s += T(CX, by + 300, 'challenging your god is not a valid operation.', { fs: 19, c: acc, op: .55, ls: 2 });
    s += `<rect x="${bx + 340}" y="${by + 350}" width="280" height="52" fill="none" stroke="${acc}" stroke-opacity=".7"/>`;
    s += T(CX, by + 376, 'TERMINATE', { fs: 20, c: ink, op: .85, ls: 6 });
    s += T(CX, by + bh + 60, 'error 0xDEAD — object cannot be repaired', { fs: 17, c: acc, op: .4, ls: 2 });
  }
  return s;
};

/* ---------- S10 解构 / 空转 ---------- */
SCENES.derender = function(c){
  const t = c.t, st = c.shot.start, lt = t - st, u = c.u;
  const acc = c.pal.accent, ink = c.pal.ink;
  let s = '';
  if (c.p.mode === 'fade'){
    s = pgrid(t, acc, 0.16, 0.08, 700);
    const k = clamp(lt / 6.5);
    s += `<g opacity="${(0.30 * (1 - k * 0.8)).toFixed(2)}">${girl({ x: CX, y: 560, s: 0.9, t })}</g>`;
    for (let i = 0; i < GIRL_PTS.length; i++){
      const alive = rnd(i * 3.1) > k * 1.05;
      if (!alive) continue;
      const [x, y] = GIRL_PTS[i];
      s += `<circle cx="${(CX + x * 1.15).toFixed(1)}" cy="${(560 + y * 1.15).toFixed(1)}" r="3.6" fill="${acc}"
        opacity="${(1 - k * 0.5).toFixed(2)}"/>`;
      if (i % 9 === 0) s += `<line x1="${(CX + x * 1.15).toFixed(1)}" y1="${(560 + y * 1.15).toFixed(1)}"
        x2="${(CX + x * 1.15 + 26).toFixed(1)}" y2="${(560 + y * 1.15 - 18).toFixed(1)}" stroke="${acc}" stroke-width="1" opacity=".25"/>`;
    }
    s += T(CX, 160, 'DERENDER', { fs: 38, c: acc, op: .45, ls: 16 });
    s += T(CX, 210, `remaining ${(100 - 100 * k).toFixed(0)}%`, { fs: 18, c: ink, op: .4, ls: 3 });
  }
  else if (c.p.mode === 'stuck'){
    s = dotGrid(acc, 0.05, 60);
    s += `<rect x="240" y="300" width="1440" height="440" fill="none" stroke="${acc}" stroke-opacity=".18"/>`;
    for (let i = 0; i < 4; i++) s += `<line x1="240" y1="${300 + i * 110}" x2="1680" y2="${300 + i * 110}" stroke="${acc}" stroke-opacity=".05"/>`;
    s += `<g transform="rotate(${(t * 140) % 360} ${CX} 340)">`;
    for (let i = 0; i < 12; i++)
      s += `<rect x="${CX - 1}" y="310" width="2" height="10" fill="${acc}" opacity="${(0.12 + i * 0.07).toFixed(2)}" transform="rotate(${i * 30} ${CX} 340)"/>`;
    s += `</g>`;
    s += T(CX, 360, 'RELOADING — object "me"', { fs: 30, c: ink, op: .85, ls: 5 });
    const w = 1100, x0 = CX - w / 2;
    s += `<rect x="${x0}" y="430" width="${w}" height="16" fill="none" stroke="${acc}" stroke-opacity=".4"/>`;
    const p = 0.965 - Math.abs(Math.sin(t * 0.6)) * 0.02;
    s += `<rect x="${x0 + 2}" y="432" width="${(w - 4) * p}" height="12" fill="${acc}" opacity=".8"/>`;
    s += T(x0, 486, '97%', { fs: 44, c: ink, anchor: 'start', op: .95 });
    s += T(x0 + w, 486, 'RETRY 12', { fs: 20, c: acc, anchor: 'end', op: .6, ls: 3 });
    for (let i = 0; i < 7; i++){
      const y = 560 + i * 42;
      const op = 0.18 + 0.22 * ((1 + Math.sin(t * 2 + i)) / 2);
      s += T(x0, y, `[${pad(Math.max(1, 12 - i))}] retry chunk ${0x2f + i * 3}a → timeout`, { fs: 17, c: acc, anchor: 'start', op });
    }
  }
  else { /* build */
    const k = easeOut(clamp(lt / 5.2));
    s = pgrid(t, acc, 0.10 + 0.35 * k, 0.5, 660);
    for (let i = 0; i < 8; i++){
      const p = clamp((k - i * 0.10) / 0.3);
      if (p <= 0) continue;
      s += `<circle cx="${CX}" cy="560" r="${(80 + i * 105).toFixed(0)}" fill="none" stroke="${acc}"
        stroke-width="${(3 - i * 0.25).toFixed(1)}" opacity="${(0.9 * p).toFixed(2)}"/>`;
    }
    s += `<g opacity="${(0.15 + 0.7 * k).toFixed(2)}">${girl({ x: CX, y: 560, s: 0.8, opacity: .9, t })}</g>`;
    s += T(CX, 160, 'REBUILD  ' + (k * 100).toFixed(0) + '%', { fs: 34, c: acc, op: .55, ls: 10 });
    s += hline(214, acc, .25 * k);
  }
  return s;
};

/* ---------- S11 EXECUTION 连呼 ---------- */
SCENES.barrage = function(c){
  const t = c.t, st = c.shot.start;
  const acc = c.pal.accent, ink = c.pal.ink;
  let s = '';
  const ly = (c.shot.lyrics || []);
  const ex = ly.filter(l => l.text === 'EXECUTION');
  const cd = ly.filter(l => l !== ex[0] && l.text !== 'EXECUTION');

  if (c.p.countdown && cd.length){
    /* 六格分屏 */
    const cells = [[480, 300], [960, 300], [1440, 300], [480, 700], [960, 700], [1440, 700]];
    s += `<g stroke="${acc}" stroke-opacity=".22" fill="none">`;
    s += `<line x1="720" y1="140" x2="720" y2="900"/><line x1="1200" y1="140" x2="1200" y2="900"/>`;
    s += `<line x1="240" y1="500" x2="1680" y2="500"/>`;
    s += `</g>`;
    [[240, 140], [720, 140], [1200, 140], [240, 500], [720, 500], [1200, 500]].forEach(([x, y], i) => {
      const on = cd[i] && t >= cd[i].t;
      s += `<rect x="${x + 6}" y="${y + 6}" width="468" height="348" fill="none"
        stroke="${acc}" stroke-opacity="${on ? .30 : .10}"/>`;
      s += T(x + 26, y + 40, `0${i + 1}`, { fs: 15, c: acc, anchor: 'start', op: on ? .55 : .25, ls: 3 });
      if (on) s += `<rect x="${x + 6}" y="${y + 350}" width="${468 * clamp((t - cd[i].t) / 0.9)}" height="2" fill="${acc}" opacity=".6"/>`;
    });
    cd.slice(0, 6).forEach((l, i) => {
      const age = t - l.t;
      const on = age >= 0;
      const pop = on ? 1 + 0.3 * (1 - easeOut(clamp(age / 0.25))) : 1;
      s += `<g opacity="${on ? clamp(1 - age / 3) : 0.06}" transform="translate(${cells[i][0]},${cells[i][1]}) scale(${pop.toFixed(2)})">`;
      s += BIG(0, 0, l.text, 112, on ? ink : acc, 1, 4);
      s += `</g>`;
    });
    const lastEx = ex[ex.length - 1];
    if (lastEx && t >= lastEx.t){
      s += `<g opacity="${clamp((t - lastEx.t) / 0.08)}">`;
      s += `<rect x="0" y="0" width="${W}" height="${H}" fill="${acc}" opacity=".10"/>`;
      s += BIG(CX, 520, 'EXECUTION', fitFs('EXECUTION', 1560, 210), ink, 1, 2);
      s += `</g>`;
    }
    s += T(CX, 130, 'COUNTDOWN // 6', { fs: 20, c: acc, op: .5, ls: 6 });
  }
  else if (c.p.idx === 7){
    /* 字墙：唯一需要「满」的镜头 */
    for (let r = 0; r < 9; r++){
      const y = 90 + r * 116;
      const dir = r % 2 ? 1 : -1;
      const off = ((t * 210 * dir) % 900 + 900) % 900 - 450;
      const fsr = 86 + (r % 3) * 16;
      for (let k = -1; k < 3; k++){
        s += `<text x="${off + k * 900}" y="${y}" text-anchor="middle" dominant-baseline="middle"
          font-family="${MONO}" font-size="${fsr}" font-weight="700" letter-spacing="-2"
          fill="${r % 4 === 0 ? ink : 'none'}" stroke="${acc}"
          stroke-width="${r % 4 === 0 ? 0 : 1.2}" opacity="${(0.06 + (r % 5) * 0.055).toFixed(2)}">EXECUTION</text>`;
      }
    }
    const done7 = ex.filter(l => l.t <= t).length;
    s += `<rect x="0" y="440" width="${W}" height="200" fill="#000" opacity=".55"/>`;
    s += BIG(CX, 520, 'EXECUTION', fitFs('EXECUTION', 1700, 240), ink, .98, 0);
    s += T(CX, 150, `${pad(done7)} / ${pad(c.p.total || 12)}`, { fs: 26, c: acc, op: .55, ls: 6 });
  }
  else if (c.p.idx === 3){
    /* 撕裂：三片横切错位 */
    const fs3 = fitFs('EXECUTION', 1720, 236);
    for (let b = 0; b < 3; b++){
      const id = 'tp' + c.shot.id + '_' + b;
      s += `<clipPath id="${id}"><rect x="0" y="${CY - fs3 * 0.55 + b * fs3 * 0.37}" width="${W}" height="${fs3 * 0.37}"/></clipPath>`;
      const dx = ((rnd(b + Math.floor(t * 12)) - .5) * 150).toFixed(0);
      s += `<g clip-path="url(#${id})" transform="translate(${dx},0)">`;
      s += `<text x="${CX}" y="${CY}" text-anchor="middle" dominant-baseline="middle" font-family="${MONO}"
        font-size="${fs3}" font-weight="700" letter-spacing="-3" fill="${b === 1 ? acc : ink}">EXECUTION</text></g>`;
    }
    const done3 = ex.filter(l => l.t <= t).length;
    s += T(CX, 150, `${pad(done3)} / ${pad(c.p.total || 12)}`, { fs: 26, c: acc, op: .55, ls: 6 });
    s += T(160, 150, 'SEGFAULT', { fs: 18, c: acc, anchor: 'start', op: .45, ls: 4 });
  }
  else {
    /* 单字连打 */
    s += pgrid(t, acc, 0.18, 0.9, 640);
    ex.forEach((l, i) => {
      const age = t - l.t;
      if (age < 0 || age > 1.1) return;
      const pop = 1 + 0.35 * (1 - easeOut(clamp(age / 0.2)));
      const drift = Math.sin(age * 30) * 6 * (1 - age);
      const op = clamp(1 - age / 1.1);
      const rot = ((rnd(i) - .5) * 4 * (1 - age)).toFixed(1);
      s += `<g transform="translate(${CX + drift},${CY}) scale(${pop.toFixed(2)}) rotate(${rot})" opacity="${op.toFixed(2)}">`;
      s += `<text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="${MONO}"
        font-size="${fitFs('EXECUTION', 1700, 240)}" font-weight="700" letter-spacing="-3"
        fill="none" stroke="${acc}" stroke-width="1.4" stroke-opacity=".7">EXECUTION</text>`;
      s += `<text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="${MONO}"
        font-size="${fitFs('EXECUTION', 1700, 240)}" font-weight="700" letter-spacing="-3" fill="${ink}">EXECUTION</text>`;
      s += `</g>`;
    });
    /* 计数器 */
    const done = ex.filter(l => l.t <= t).length;
    s += T(CX, 150, `${pad(done)} / ${pad(c.p.total || 12)}`, { fs: 26, c: acc, op: .5, ls: 6 });
    s += T(160, 150, 'EXECUTE_ALL', { fs: 18, c: acc, anchor: 'start', op: .4, ls: 3 });
    s += hline(190, acc, .2);
    /* 噪点 */
    for (let i = 0; i < 46; i++){
      const x = rnd(i + Math.floor(t * 8)) * W, y = rnd(i + 3 + Math.floor(t * 8)) * H;
      s += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${(2 + rnd(i) * 6).toFixed(0)}" height="2" fill="${acc}" opacity="${(0.12 + rnd(i + 2) * 0.25).toFixed(2)}"/>`;
    }
  }
  return s;
};

};

  const t = c.t, st = c.shot.start, lt = t - st, u = c.u;
  const acc = c.pal.accent, ink = c.pal.ink;

      'love.domain  = ℝ',

      'return love;'
    ];
    s += T(CX, 236, '// lecture 13 — the mathematics of love', { fs: 19, c: acc, op: .35, ls: 3 });

    s += `<g opacity=".55">${girl({ x: 1452, y: 780, s: 0.66, color: true, t })}</g>`;
    rows.forEach((r, i) => {
      const k = clamp((t - (st + 0.25 + i * 0.62)) / 0.5);
      if (k <= 0) return;
      const str = r.slice(0, Math.max(1, Math.ceil(r.length * k)));
      s += T(CX, 300 + i * 104, str, { fs: 54, c: i === 4 ? ink : acc, op: .22 + .72 * k, ls: 3 });
      if (k >= 1) s += `<rect x="${CX - 260}" y="${300 + i * 104 + 26}" width="520" height="1"
        fill="${acc}" opacity=".16"/>`;
    });
    for (let i = 0; i < 34; i++){

    }
  }
  else if (mode === 'question'){
    for (let i = 0; i < 7; i++)
      for (let j = 0; j < 12; j++){
        const d = (i + j) * 0.08;
        const op = clamp((Math.sin(t * 2 - d) + 1) / 2) * 0.30 + 0.06;
        s += T(200 + j * 128, 200 + i * 96, '?', { fs: 52, c: acc, op: op.toFixed(2) });

    s += `<rect x="0" y="380" width="${W}" height="300" fill="#000" opacity=".55"/>`;
    s += BIG(CX, 470, 'QUESTION ME', fitFs('QUESTION ME', 1500, 150), ink, .95, 4);
    s += T(CX, 566, 'I can answer all', { fs: 30, c: acc, op: .65, ls: 6 });

  }
  else if (mode === 'algebra'){
    s += `<g opacity="${(0.55 + 0.25 * Math.sin(t * 3)).toFixed(2)}">`;
    s += girl({ x: CX, y: 700, s: 0.52, opacity: .35, color: true, t });
    s += `</g>`;
    s += T(CX, 300, 'LOVE', { fs: 96, c: ink, op: .95, ls: 10, w: 700 });
    s += T(CX, 372, '= algebraic expression of', { fs: 26, c: acc, op: .6, ls: 4 });
    const terms = ['lim(x→you)', 'd/dt[heart]', '∫ memory dt', '√(soul²)'];
    terms.forEach((tm, i) => {
      const k = clamp((t - (st + 0.7 + i * 0.85)) / 0.5);
      if (k <= 0) return;
      const cut = clamp((t - (st + 3.1 + i * 0.28)) / 0.35);
      const x = CX + (i - 1.5) * 330;
      s += `<g opacity="${k.toFixed(2)}">`;
      s += T(x, 500, tm, { fs: 36, c: cut > 0.5 ? acc : ink, op: 1 - cut * 0.55, ls: 1 });
      if (cut > 0) s += `<line x1="${x - 150}" y1="500" x2="${x - 150 + 300 * cut}" y2="500" stroke="${acc}" stroke-width="3" opacity=".9"/>`;
      s += `</g>`;
      if (i < 3) s += T(x + 165, 500, ['+', '−', '×'][i], { fs: 30, c: acc, op: .5 * k });
    });
    const fin = clamp((t - (st + 4.6)) / 0.5);
    if (fin > 0) s += `<g opacity="${fin.toFixed(2)}">` + BIG(CX, 630, 'LOVE = YOU', 92, ink, 1, 6) + `</g>`;
  }
  else { /* trapped */
    const wob = Math.sin(t * 5) * 2;
    s += `<g transform="translate(${wob.toFixed(1)},0)">`;
    s += `<ellipse cx="${CX}" cy="520" rx="470" ry="230" fill="#0a0510" stroke="${acc}" stroke-width="3"/>`;
    for (let i = 0; i < 8; i++){
      s += `<circle cx="${CX}" cy="520" r="${60 + i * 44}" fill="none" stroke="${acc}" stroke-opacity="${(0.28 - i * 0.03).toFixed(2)}" stroke-dasharray="${i % 2 ? '4 14' : 'none'}"/>`;
    }
    s += `<circle cx="${CX}" cy="520" r="86" fill="${acc}" opacity=".9"/>`;
    s += `<circle cx="${CX}" cy="520" r="40" fill="#0a0510"/>`;
    s += `<circle cx="${CX + 26}" cy="500" r="12" fill="#fff" opacity=".85"/>`;
    s += `</g>`;
    /* 虹膜刻字 */
    for (let i = 0; i < 4; i++){
      const a = -Math.PI / 2 + i * TAU / 4 + t * 0.3;
      s += T(CX + Math.cos(a) * 300, 520 + Math.sin(a) * 150, 'LOVE'[i], { fs: 60, c: acc, op: .45, w: 700 });
    }
    s += T(CX, 830, 'though you are free', { fs: 30, c: acc, op: .55, ls: 5 });
    s += T(CX, 888, 'I AM TRAPPED', { fs: 52, c: ink, op: .9, ls: 10, w: 700 });
  }
  return s;
};

/* ---------- S14 收束 ---------- */
SCENES.collapse = function(c){
  const t = c.t, st = c.shot.start, lt = t - st, u = c.u;
  const acc = c.pal.accent, ink = c.pal.ink;
  let s = '';
  if (c.p.mode === 'slow'){
    const k = clamp(lt / 6.6);
    s = pgrid(t, acc, 0.30 * (1 - k * 0.6), 0.18 * (1 - k), 660);
    s += `<g opacity="${(0.95 - k * 0.4).toFixed(2)}">${girl({ x: CX, y: 560, s: 0.92, t })}</g>`;
    for (let i = 0; i < 20; i++){
      const y = rnd(i) * H;
      if (rnd(i + 40) > 0.4 + k * 0.6)
        s += `<line x1="0" y1="${y.toFixed(0)}" x2="${W}" y2="${y.toFixed(0)}" stroke="${acc}" stroke-width="1" opacity=".06"/>`;
    }
    s += T(CX, 170, 'SHUTTING DOWN', { fs: 30, c: acc, op: .35 * (1 - k) + .1, ls: 14 });
    s += T(CX, 940, `power ${(100 - k * 96).toFixed(0)}%`, { fs: 18, c: acc, op: .3, ls: 4 });
  }
  else if (c.p.mode === 'dim'){
    const k = clamp(lt / 5.4);
    s = dotGrid(acc, 0.03, 64);
    const dim = 1 - k * 0.75;
    s += girl({ x: CX, y: 560, s: 0.92, opacity: (0.85 * dim).toFixed(2), t });
    for (let i = 0; i < 26; i++){
      const x = 420 + rnd(i) * 1080, y = 260 + rnd(i + 9) * 640;
      const on = rnd(i + 30) > k;
      if (on) s += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="16" height="16" fill="${acc}" opacity="${(0.10 + rnd(i) * 0.2).toFixed(2)}"/>`;
    }
    s += T(CX, 900, `signal ${(100 - k * 78).toFixed(0)}%`, { fs: 18, c: acc, op: .3, ls: 5 });
  }
  else { /* final */
    const exT = 205.811 - st;                 // 最后一击
    const closeT = 207.35 - st;               // 闭眼
    const crtT = 207.85 - st;                 // CRT 收线
    const eAge = lt - exT;
    if (eAge >= 0 && eAge < 0.5){
      s += `<g opacity="${clamp(1 - eAge / 0.5)}">` + BIG(CX, 520, 'EXECUTION', fitFs('EXECUTION', 1600, 200), ink, 1, 0) + `</g>`;
      s += `<rect x="0" y="0" width="${W}" height="${H}" fill="${acc}" opacity="${(0.2 * (1 - eAge / 0.5)).toFixed(3)}"/>`;
    }
    const open = lt < closeT ? 1 : Math.max(0, 1 - (lt - closeT) / 0.5);
    if (lt < crtT){
      s += girl({ x: CX, y: 700, s: 1.42, sprite: 'bust', opacity: .92, t });
      s += T(CX, 150, 'E X E C U T I O N', { fs: 22, c: acc, op: .35, ls: 10 });
    }
    if (lt >= crtT){
      const k = clamp((lt - crtT) / 0.45);
      const hgt = Math.max(1, 1080 * (1 - easeIn(k)));
      const wid = Math.max(2, 1920 * (1 - easeIn(clamp((k - 0.55) / 0.45))));
      s += `<rect x="${(CX - wid / 2).toFixed(1)}" y="${(CY - hgt / 2).toFixed(1)}" width="${wid.toFixed(1)}" height="${hgt.toFixed(1)}" fill="${acc}" opacity=".95" filter="url(#glow)"/>`;
      s += `<ellipse cx="${CX}" cy="${CY}" rx="${(wid * 0.9).toFixed(1)}" ry="${(hgt * 0.55).toFixed(1)}" fill="${acc}" opacity=".18" filter="url(#soft)"/>`;
    }
  }
  return s;
};

/* ---------- S15 黑场 ---------- */
SCENES.idle = function(c){
  const on = Math.floor(c.t * 1.6) % 2 === 0;
  let s = '';
  if (on) s += `<rect x="150" y="500" width="16" height="34" fill="${c.pal.accent}" opacity=".85"/>`;
  s += T(180, 517, 'C:\\> _disconnected', { fs: 22, c: c.pal.accent, anchor: 'start', op: .18, ls: 2 });
  return s;
};

/*__MORE_SCENES__*/

/* ============================================================
   引擎
   ============================================================ */
const $ = id => document.getElementById(id);
const sceneEl = $('scene'), fxEl = $('fx'), hudEl = $('hud'), lyricEl = $('lyric'), chromeEl = $('chrome');
const audio = $('audio');

function shotAt(t){
  let lo = 0, hi = SHOTS.length - 1;
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    const s = SHOTS[mid];
    if (t < s.start) hi = mid - 1;
    else if (t >= s.end) lo = mid + 1;
    else return s;
  }
  return t >= DUR ? SHOTS[SHOTS.length - 1] : SHOTS[0];
}
function sectionAt(t){ for (const s of SECS) if (t >= s.start && t < s.end) return s; return SECS[SECS.length - 1]; }

/* 拍点：从 cues 里带进来的话太占地方，这里用 BPM 常量重建 */
const BEATS = (() => {
  const b = [], bpm = SB.meta.bpm || 129.2, first = SB.meta.firstBeat ?? 0.209, dur = 0.4644;
  for (let t = first; t < DUR; t += 60 / bpm) b.push(t);
  return b;
})();
function beatPulse(t){
  let best = 0;
  for (let i = BEATS.length - 1; i >= 0; i--){
    const d = t - BEATS[i];
    if (d < 0) continue;
    if (d > 0.5) break;
    best = Math.max(best, Math.pow(1 - d / 0.18, 2));
    break;
  }
  return clamp(best);
}

let lastShotId = -1, lastPal = '';
function applyPalette(pal){
  $('bgA').setAttribute('fill', pal.base[0]);
  $('g0').setAttribute('stop-color', pal.base[1]);
  $('g1').setAttribute('stop-color', pal.base[0]);
  /* 立绘双色调：暗部=段底色，中间=强调色，亮部=近墨色 */
  const dk = hex2rgb(pal.base[0]), ac = hex2rgb(pal.accent), ink = hex2rgb(pal.ink);
  const md = mixc(dk, ac, 0.62), hi = mixc(ac, ink, 0.42);
  ['dR', 'dG', 'dB'].forEach((id, i) => {
    document.getElementById(id).setAttribute('tableValues',
      `${dk[i].toFixed(3)} ${md[i].toFixed(3)} ${hi[i].toFixed(3)}`);
  });
  document.documentElement.style.setProperty('--acc', pal.accent);
  document.documentElement.style.setProperty('--ink', pal.ink);
}

function render(t){
  t = clamp(t, 0, DUR);
  const sh = shotAt(t);
  const pal = PALS[sh.palette] || PALS[Object.keys(PALS)[0]];
  const ctx = {
    t, shot: sh, p: sh.params || {},
    u: clamp((t - sh.start) / (sh.end - sh.start)),
    tIn: t - sh.start, tLeft: sh.end - t,
    pal, beat: beatPulse(t), frame: Math.round(t * FPS)
  };
  if (sh.id !== lastShotId || sh.palette !== lastPal){
    applyPalette(pal);
    lastShotId = sh.id; lastPal = sh.palette;
  }
  const fn = SCENES[sh.scene];
  sceneEl.innerHTML = fn ? fn(ctx) : '';

  /* 转场 */
  let fx = '';
  const tin = ctx.tIn, tr = sh.transition_in;
  const beatGlow = ctx.beat;
  if (tr === 'flash' && tin < 0.14){
    const k = 1 - tin / 0.14;
    fx += `<rect x="0" y="0" width="1920" height="1080" fill="${pal.ink}" opacity="${(k * 0.9).toFixed(3)}"/>`;
  }
  if (tr === 'fade' && tin < 0.55){
    const k = 1 - tin / 0.55;
    fx += `<rect x="0" y="0" width="1920" height="1080" fill="${pal.base[0]}" opacity="${k.toFixed(3)}"/>`;
  }
  if (tr === 'dissolve' && tin < 0.45){
    const k = 1 - tin / 0.45;
    fx += `<rect x="0" y="0" width="1920" height="1080" fill="${pal.base[1]}" opacity="${(k * 0.85).toFixed(3)}"/>`;
  }
  if ((tr === 'wipe_l' || tr === 'wipe_r') && tin < 0.30){
    const k = 1 - tin / 0.30;
    const w = 1920 * k;
    const x = tr === 'wipe_l' ? 0 : 1920 - w;
    fx += `<rect x="${x}" y="0" width="${w}" height="1080" fill="${pal.base[0]}"/>`;
    fx += `<rect x="${tr === 'wipe_l' ? w : 1920 - w - 6}" y="0" width="6" height="1080" fill="${pal.accent}" opacity=".8"/>`;
  }
  if (tr === 'glitch' && tin < 0.26){
    const k = 1 - tin / 0.26;
    for (let i = 0; i < 9; i++){
      const y = rnd(i + ctx.frame) * 1080, h = 8 + rnd(i + 40) * 60;
      fx += `<rect x="0" y="${y.toFixed(0)}" width="1920" height="${h.toFixed(0)}" fill="${i % 2 ? pal.accent : '#000'}" opacity="${(k * 0.55).toFixed(2)}"/>`;
    }
  }
  /* 冲击帧 */
  for (const ev of SB.events){
    if (ev.kind === 'hit' && Math.abs(t - ev.t) < (ev.frames || 2) / FPS){
      fx += `<rect x="0" y="0" width="1920" height="1080" fill="${ev.color}" opacity=".85"/>`;
    }
    if (ev.kind === 'color_flash' && t >= ev.t && t < ev.t + 2 / FPS){
      fx += `<rect x="0" y="0" width="1920" height="1080" fill="${ev.color}" opacity=".35"/>`;
    }
  }
  fxEl.innerHTML = fx;

  drawHUD(ctx, pal);
  drawLyric(ctx, pal);
}

/* ---- HUD ---- */
function tc(t){ const m = Math.floor(t / 60), s = t - m * 60; return pad(m) + ':' + (s < 10 ? '0' : '') + s.toFixed(2); }
function drawHUD(ctx, pal){
  const t = ctx.t, sec = sectionAt(t);
  let h = '';
  h += T(64, 62, 'MILI — world.execute(me);', { fs: 17, c: pal.accent, anchor: 'start', op: .55, ls: 2 });
  h += T(1856, 62, tc(t) + ' / ' + tc(DUR), { fs: 17, c: pal.ink, anchor: 'end', op: .55, ls: 1 });
  h += T(64, 90, `FRAME ${pad(ctx.frame, 5)}  ·  FPS ${FPS}`, { fs: 14, c: pal.accent, anchor: 'start', op: .35, ls: 2 });
  h += T(1856, 90, `${sec.id} ${sec.name}`, { fs: 14, c: pal.accent, anchor: 'end', op: .38, ls: 1 });
  /* 节拍点 */
  const bi = Math.floor((t - 0.209) / (60 / 129.2));
  for (let i = 0; i < 4; i++){
    const on = ((bi % 4) + 4) % 4 === i;
    h += `<rect x="${1836 - (3 - i) * 16}" y="108" width="10" height="4" fill="${pal.accent}"
      opacity="${on ? 0.95 : 0.22}"/>`;
  }
  /* 进度 */
  const py = 1032;
  h += `<rect x="64" y="${py}" width="${1792}" height="1" fill="${pal.accent}" opacity=".18"/>`;
  h += `<rect x="64" y="${py}" width="${(1792 * t / DUR).toFixed(1)}" height="1" fill="${pal.accent}" opacity=".75"/>`;
  for (const s of SECS){
    const x = 64 + 1792 * s.start / DUR;
    h += `<rect x="${x.toFixed(1)}" y="${py - 3}" width="1" height="7" fill="${pal.accent}" opacity=".3"/>`;
  }
  for (const sh of SHOTS){
    const x = 64 + 1792 * sh.start / DUR;
    h += `<rect x="${x.toFixed(1)}" y="${py + 3}" width="1" height="3" fill="${pal.ink}" opacity=".16"/>`;
  }
  h += `<circle cx="${(64 + 1792 * t / DUR).toFixed(1)}" cy="${py}" r="3.2" fill="${pal.ink}"/>`;
  hudEl.innerHTML = h;
}

/* ---- 字幕 ---- */
function drawLyric(ctx, pal){
  if (NO_SUB.has(ctx.shot.scene)){ lyricEl.innerHTML = ''; return; }
  const lines = ctx.shot.lyrics;
  if (!lines || !lines.length){ lyricEl.innerHTML = ''; return; }
  let cur = null, prev = null;
  for (const l of lines){ if (l.t <= ctx.t + 1e-6) { prev = cur; cur = l; } }
  if (!cur) cur = lines[0];
  let s = '';
  const age = ctx.t - cur.t;
  const k = clamp(age / 0.18);
  const shown = cur.text.slice(0, Math.max(1, Math.ceil(cur.text.length * k)));
  if (prev && ctx.t - prev.t < 2.6){
    s += T(CX, 928, prev.text, { fs: 22, c: pal.ink, op: (0.30 * (1 - (ctx.t - prev.t) / 2.6)).toFixed(2), ls: 2 });
  }
  s += `<rect x="${CX - 470}" y="952" width="940" height="1" fill="${pal.accent}" opacity=".18"/>`;
  s += T(CX - 452, 984, '›', { fs: 26, c: pal.accent, anchor: 'middle', op: .85 });
  s += T(CX + 26, 984, shown, { fs: 33, c: pal.ink, op: .95, ls: 1 });
  /* 打字光标 */
  if (k < 1 || Math.floor(ctx.t * 3) % 2 === 0){
    const w = shown.length * 19.8;
    s += `<rect x="${(CX + 26 + w + 6).toFixed(1)}" y="966" width="13" height="30" fill="${pal.accent}" opacity=".8"/>`;
  }
  lyricEl.innerHTML = s;
}

/* ---- 静态框线 ---- */
function buildChrome(){
  const c = 46, L = 34;
  let s = '';
  [[c, c, 1, 1], [W - c, c, -1, 1], [c, H - c, 1, -1], [W - c, H - c, -1, -1]].forEach(([x, y, sx, sy]) => {
    s += `<path d="M ${x} ${y + sy * L} L ${x} ${y} L ${x + sx * L} ${y}" stroke="#ffffff" stroke-opacity=".18" fill="none" stroke-width="1.5"/>`;
  });
  chromeEl.innerHTML = s;
}
buildChrome();

/* ---- 播放控制 ---- */
let playing = false, raf = 0, lastFrame = -1;
function loop(){
  if (!audio.paused){
    const f = Math.round(audio.currentTime * FPS);
    if (f !== lastFrame){ lastFrame = f; render(f / FPS); }
  }
  raf = requestAnimationFrame(loop);
}
function play(){
  audio.play().then(() => { playing = true; $('play').textContent = '❚❚'; })
    .catch(e => { console.warn('play blocked', e); });
}
function pause(){ audio.pause(); playing = false; $('play').textContent = '▶'; render(audio.currentTime); }
$('play').onclick = e => { e.stopPropagation(); audio.paused ? play() : pause(); };

const track = $('track'), fill = $('fill'), ph = $('ph');
function seekFromEvent(e){
  const r = track.getBoundingClientRect();
  const x = clamp((e.clientX - r.left) / r.width);
  audio.currentTime = x * DUR;
  lastFrame = Math.round(audio.currentTime * FPS);
  render(lastFrame / FPS);
}
let dragging = false;
track.addEventListener('pointerdown', e => { dragging = true; seekFromEvent(e); });
window.addEventListener('pointermove', e => { if (dragging) seekFromEvent(e); });
window.addEventListener('pointerup', () => { dragging = false; });

function updateUI(){
  const t = audio.currentTime;
  fill.style.width = (t / DUR * 100) + '%';
  ph.style.left = (t / DUR * 100) + '%';
  $('tc').textContent = tc(t);
  const sec = sectionAt(t);
  $('secLabel').textContent = sec.id + ' ' + sec.name.split(' / ')[0];
  requestAnimationFrame(updateUI);
}
updateUI();

/* 刻度 */
(function(){
  let s = '';
  for (const sec of SECS){
    s += `<i style="left:${(sec.start / DUR * 100).toFixed(2)}%"></i>`;
  }
  $('ticks').innerHTML = s;
})();

/* 开场 */
const bootEl = $('boot');
function start(){
  if (!bootEl.classList.contains('gone')){
    bootEl.classList.add('gone');
    $('ui').classList.remove('hide');
    setTimeout(() => { $('ui').classList.add('hide'); }, 2600);
  }
  play();
}
bootEl.onclick = start;
window.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); if (bootEl.classList.contains('gone')) { audio.paused ? play() : pause(); } else start(); }
  if (e.code === 'ArrowRight'){ audio.currentTime = clamp(audio.currentTime + 5, 0, DUR); lastFrame = Math.round(audio.currentTime * FPS); render(lastFrame / FPS); }
  if (e.code === 'ArrowLeft'){ audio.currentTime = clamp(audio.currentTime - 5, 0, DUR); lastFrame = Math.round(audio.currentTime * FPS); render(lastFrame / FPS); }
});
window.addEventListener('mousemove', () => {
  if (!bootEl.classList.contains('gone')) return;
  $('ui').classList.remove('hide');
  clearTimeout(window._uiT);
  window._uiT = setTimeout(() => { if (!dragging) $('ui').classList.add('hide'); }, 2200);
});
audio.addEventListener('ended', () => { pause(); audio.currentTime = DUR; render(DUR); });

/* 自检：?selftest=1 时把每个镜头中段都渲染一遍，报告错误与耗时 */
function selftest(){
  const out = [];
  let worst = 0, total = 0, errs = 0;
  for (const sh of SHOTS){
    const t = (sh.start + sh.end) / 2;
    const t0 = performance.now();
    try { render(t); } catch (e){ errs++; out.push(`ERR shot ${sh.id} ${sh.scene}: ${e.message}`); }
    const dt = performance.now() - t0;
    total += dt; worst = Math.max(worst, dt);
    if (dt > 40) out.push(`SLOW shot ${sh.id} ${sh.scene} ${dt.toFixed(1)}ms`);
  }
  const pre = document.createElement('pre');
  pre.id = 'selftest';
  pre.textContent = `SCENES=${Object.keys(SCENES).length} SHOTS=${SHOTS.length} ERRORS=${errs}`
    + ` AVG=${(total / SHOTS.length).toFixed(2)}ms WORST=${worst.toFixed(2)}ms\n` + out.join('\n');
  document.body.appendChild(pre);
  document.title = `SELFTEST ok=${errs === 0}`;
}
if (location.search.includes('selftest')) { try { selftest(); } catch (e){ document.title = 'SELFTEST fatal ' + e.message; } }

/* 首帧 + 深链 #t=59.2 */
(function init(){
  const m = location.hash.match(/t=([\d.]+)/);
  const t0 = m ? parseFloat(m[1]) : 0;
  audio.addEventListener('loadedmetadata', () => render(audio.currentTime));
  render(t0);
  if (m){ audio.currentTime = t0; bootEl.style.display = 'none'; $('ui').classList.remove('hide'); }
  loop();
})();
window.__seek = t => { audio.currentTime = t; lastFrame = Math.round(t * FPS); render(lastFrame / FPS); };
</script>
